name: Check application and prepare Hostland release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Build application and API
        run: npm run build
        env:
          VITE_PHONE_MAKS: ${{ secrets.VITE_PHONE_MAKS }}
          VITE_PHONE_VLAD: ${{ secrets.VITE_PHONE_VLAD }}
          VITE_PHONE_HREF: ${{ secrets.VITE_PHONE_HREF }}
          VITE_WHATSAPP_MAKS: ${{ secrets.VITE_WHATSAPP_MAKS }}
          VITE_WHATSAPP_VLAD: ${{ secrets.VITE_WHATSAPP_VLAD }}
          VITE_TELEGRAM_MAKS: ${{ secrets.VITE_TELEGRAM_MAKS }}
          VITE_TELEGRAM_VLAD: ${{ secrets.VITE_TELEGRAM_VLAD }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}

      - name: Package Hostland release for review
        if: github.event_name == 'workflow_dispatch'
        run: npm run package:hostland

      - name: Upload release archives
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hamper-hostland
          path: |
            release/hamper-hostland_*.zip
            release/hamper-public-update_*.zip
            release/verification.json
          if-no-files-found: error
          retention-days: 14
