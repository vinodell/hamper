name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PHONE_MAKS: ${{ secrets.VITE_PHONE_MAKS }}
          VITE_PHONE_VLAD: ${{ secrets.VITE_PHONE_VLAD }}
          VITE_PHONE_HREF: ${{ secrets.VITE_PHONE_HREF }}
          VITE_WHATSAPP_MAKS: ${{ secrets.VITE_WHATSAPP_MAKS }}
          VITE_WHATSAPP_VLAD: ${{ secrets.VITE_WHATSAPP_VLAD }}
          VITE_TELEGRAM_MAKS: ${{ secrets.VITE_TELEGRAM_MAKS }}
          VITE_TELEGRAM_VLAD: ${{ secrets.VITE_TELEGRAM_VLAD }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}

      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4